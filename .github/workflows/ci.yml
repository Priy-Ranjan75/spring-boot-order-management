name: Order Management CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI - Build, Test & Docker
  # =========================
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: order_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/order_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout source code
        uses: actions/checkout@v5

      # -------------------------
      # Java 17
      # -------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # -------------------------
      # Build Spring Boot app
      # -------------------------
      - name: Build application
        run: mvn clean package -DskipTests
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/order_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

      # -------------------------
      # Run tests
      # -------------------------
      - name: Run tests
        run: mvn test
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/order_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

      # -------------------------
      # Docker Buildx
      # -------------------------
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # Docker Hub Login
      # -------------------------
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # Build & Push Docker image
      # -------------------------
      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/order-management:latest


  # =========================
  # CD - Deploy to Local Server
  # =========================
  deploy:
    name: Deploy to Local Server

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:

      # -------------------------
      # Checkout source code
      # -------------------------
      - name: Checkout source code
        uses: actions/checkout@v5

      # -------------------------
      # Login to Docker Hub
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # Pull latest images
      # -------------------------
      - name: Pull latest Docker image
        shell: powershell
        run: |
          docker compose pull

      # -------------------------
      # Stop existing containers
      # -------------------------
      - name: Stop existing containers
        shell: powershell
        run: |
          docker compose down

      # -------------------------
      # Start application
      # -------------------------
      - name: Start application
        shell: powershell
        run: |
          docker compose up -d

      # -------------------------
      # Show deployment status
      # -------------------------
      - name: Show deployment status
        shell: powershell
        run: |
          docker compose ps

      # -------------------------
      # Verify application
      # -------------------------
      - name: Verify application
        shell: powershell
        run: |
          Start-Sleep -Seconds 20
          docker compose ps

      # -------------------------
      # Show logs if deployment fails
      # -------------------------
      - name: Show application logs if deployment fails
        if: failure()
        shell: powershell
        run: |
          docker compose logs --tail=100